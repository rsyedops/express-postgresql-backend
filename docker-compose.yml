name: realworld-express-ts-postgres-drizzle
services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    env_file: ".env"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    env_file: ".env"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - postgres
volumes:
  pgdata:
  node_modules:
